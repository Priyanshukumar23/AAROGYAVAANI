<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet"/>
<style>
  @layer base {
    html, body { margin: 0; padding: 0; }
    body { overscroll-behavior: none; }
  }
  ::-webkit-scrollbar { display: none; }
</style>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
          "outline-variant": "#c4c6ce",
          "on-tertiary": "#ffffff",
          "secondary-fixed": "#cce5ff",
          "surface-variant": "#d3e4fe",
          "outline": "#74777e",
          "tertiary-fixed": "#85f8c4",
          "surface-container-high": "#dce9ff",
          "on-error": "#ffffff",
          "surface-container-highest": "#d3e4fe",
          "inverse-primary": "#b0c8eb",
          "on-tertiary-fixed": "#002114",
          "on-primary-fixed": "#001c37",
          "on-secondary": "#ffffff",
          "surface": "#f8f9ff",
          "tertiary": "#001209",
          "surface-bright": "#f8f9ff",
          "error-container": "#ffdad6",
          "tertiary-fixed-dim": "#68dba9",
          "primary-container": "#0a2540",
          "on-error-container": "#93000a",
          "primary": "#000f22",
          "on-surface-variant": "#43474d",
          "secondary": "#006398",
          "surface-tint": "#49607e",
          "secondary-fixed-dim": "#93ccff",
          "on-tertiary-container": "#1a9e70",
          "on-primary-fixed-variant": "#314865",
          "surface-container-low": "#eff4ff",
          "on-primary-container": "#768dad",
          "on-secondary-fixed": "#001d31",
          "primary-fixed": "#d2e4ff",
          "inverse-on-surface": "#eaf1ff",
          "inverse-surface": "#213145",
          "error": "#ba1a1a",
          "secondary-container": "#5bb8fe",
          "primary-fixed-dim": "#b0c8eb",
          "tertiary-container": "#002a1b",
          "on-secondary-fixed-variant": "#004b73",
          "surface-dim": "#cbdbf5",
          "on-secondary-container": "#00476e",
          "background": "#f8f9ff",
          "on-tertiary-fixed-variant": "#005137",
          "on-primary": "#ffffff",
          "surface-container": "#e5eeff",
          "on-surface": "#0b1c30",
          "surface-container-lowest": "#ffffff",
          "on-background": "#0b1c30"
        },
        "borderRadius": {
          "DEFAULT": "0.125rem",
          "lg": "0.5rem",
          "xl": "0.875rem",
          "2xl": "1.25rem",
          "full": "9999px"
        },
        "fontFamily": {
          "headline": ["Plus Jakarta Sans", "sans-serif"],
          "body": ["Inter", "sans-serif"]
        }
      }
    }
  };
</script>
</head>
<body class="bg-surface font-body text-on-surface antialiased select-none min-h-screen flex flex-col">
<!-- 1. HEADER: Clean Step 1 patient header only -->
<header class="w-full bg-surface-container-lowest border-b border-surface-container shadow-sm sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-6 h-24 flex items-center justify-between">
<!-- Brand Logo & Clean Subtitle -->
<div class="flex items-center gap-4">
<img alt="MediKiosk" class="h-10 w-auto object-contain" src="https://lh3.googleusercontent.com/aida/AEtjO1VoaoLs2vFTDGh3WT9W-swt32kIm0zNFJeiuzluJflxrvfH8D4R8tzslbDs_zwUQhqckq6GZKA-PMI9ClrgK3iFsnFFhta53OJLbd_VhuOF8Cj1IgG7TjSZDGqqDzUGZ6dUdHrF9TQENaFtUnzvcp3XjQwbo7xkdNesWzbppl762ORoek9i5jo0qfwFFzKE_HOcSFE8rRYWYlsmCArJxyX-Ml_Qek84baznxdutj2iUlV3-OXunM-gRIA"/>
<div class="flex flex-col">
<span class="font-headline font-bold text-2xl text-primary tracking-tight">MediKiosk</span>
<span class="text-sm font-medium text-on-surface-variant">AI-Powered Clinical Intake</span>
</div>
</div>
<!-- Patient Action Buttons: Audio, Language, Help -->
<div class="flex items-center gap-3">
<!-- Audio Toggle -->
<button class="h-14 px-5 rounded-2xl bg-surface-container-low text-primary flex items-center gap-2.5 hover:bg-surface-container transition-all active:scale-98 border border-surface-container text-base font-semibold shadow-sm" type="button">
<span class="material-symbols-outlined text-secondary text-2xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span>Audio • ऑडियो</span>
</button>
<!-- Language Toggle -->
<button class="h-14 px-5 rounded-2xl bg-secondary-fixed text-on-secondary-fixed flex items-center gap-2.5 hover:bg-secondary-fixed-dim transition-all active:scale-98 text-base font-bold shadow-sm" type="button">
<span class="material-symbols-outlined text-xl">translate</span>
<span>English / हिन्दी</span>
</button>
<!-- Help Button -->
<button class="h-14 px-5 rounded-2xl bg-error-container text-on-error-container flex items-center gap-2.5 hover:opacity-90 transition-all active:scale-98 text-base font-bold shadow-sm" type="button">
<span class="material-symbols-outlined text-error text-2xl font-bold">help</span>
<span>Help • सहायता</span>
</button>
</div>
</div>
</header>
<!-- 2. MAIN CONTENT: Single clear task, centered calm card -->
<main class="flex-1 max-w-4xl w-full mx-auto px-6 py-10 flex flex-col justify-center">
<!-- Title & Simple Instruction -->
<div class="text-center mb-8">
<h1 class="font-headline font-bold text-3xl md:text-4xl text-primary tracking-tight">
      New Patient Registration • नया मरीज पंजीकरण
    </h1>
<p class="text-lg md:text-xl text-on-surface-variant mt-2">
      Enter only essential details to get your OPD token. (पर्ची के लिए आवश्यक जानकारी भरें)
    </p>
</div>
<!-- 3. ESSENTIAL FORM FIELDS ONLY (Large, calm, touch-friendly) -->
<div class="bg-surface-container-lowest rounded-2xl p-8 md:p-10 shadow-sm border border-surface-container flex flex-col gap-8">
<!-- Full Name -->
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2" for="patient-name">
<span class="material-symbols-outlined text-secondary text-2xl">person</span>
        Full Name • पूरा नाम
      </label>
<div class="relative flex items-center">
<input class="w-full h-20 px-6 rounded-2xl bg-surface-container-low text-primary text-xl md:text-2xl font-medium border-2 border-transparent focus:border-secondary focus:bg-surface-container-lowest outline-none transition-all" id="patient-name" placeholder="नाम लिखें / Enter full name" type="text" value="Ramesh Kumar Sharma"/>
<button class="absolute right-5 text-outline hover:text-primary p-2 transition-colors" onclick="document.getElementById('patient-name').value=''; document.getElementById('patient-name').focus();" type="button">
<span class="material-symbols-outlined text-3xl">cancel</span>
</button>
</div>
</div>
<!-- Age & Stepper -->
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-2xl">calendar_today</span>
        Age • आयु
      </label>
<div class="h-20 flex items-center justify-between rounded-2xl bg-surface-container-low px-3 border-2 border-transparent">
<button aria-label="Decrease age" class="w-16 h-16 rounded-xl bg-surface-container-lowest text-primary flex items-center justify-center active:scale-95 shadow-sm hover:bg-surface-container transition-all border border-surface-container" id="age-decrement" type="button">
<span class="material-symbols-outlined font-extrabold text-3xl">remove</span>
</button>
<div class="flex items-baseline gap-2">
<span class="font-headline font-bold text-4xl text-primary" id="age-display">48</span>
<span class="text-xl text-on-surface-variant font-medium">Years (वर्ष)</span>
</div>
<button aria-label="Increase age" class="w-16 h-16 rounded-xl bg-surface-container-lowest text-primary flex items-center justify-center active:scale-95 shadow-sm hover:bg-surface-container transition-all border border-surface-container" id="age-increment" type="button">
<span class="material-symbols-outlined font-extrabold text-3xl">add</span>
</button>
</div>
</div>
<!-- Gender (3 Large Buttons) -->
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-2xl">wc</span>
        Gender • लिंग
      </label>
<div class="grid grid-cols-3 gap-4" id="gender-group">
<button class="gender-btn h-20 rounded-2xl bg-primary text-on-primary flex items-center justify-center gap-2 font-headline text-xl font-bold transition-all shadow-md active:scale-98" data-gender="Male" type="button">
<span class="material-symbols-outlined text-2xl">male</span>
<span>Male (पुरुष)</span>
</button>
<button class="gender-btn h-20 rounded-2xl bg-surface-container-low text-primary flex items-center justify-center gap-2 font-headline text-xl font-bold hover:bg-surface-container transition-all border border-surface-container active:scale-98" data-gender="Female" type="button">
<span class="material-symbols-outlined text-2xl">female</span>
<span>Female (महिला)</span>
</button>
<button class="gender-btn h-20 rounded-2xl bg-surface-container-low text-primary flex items-center justify-center gap-2 font-headline text-xl font-bold hover:bg-surface-container transition-all border border-surface-container active:scale-98" data-gender="Other" type="button">
<span class="material-symbols-outlined text-2xl">transgender</span>
<span>Other (अन्य)</span>
</button>
</div>
</div>
<!-- Mobile Number -->
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2" for="patient-phone">
<span class="material-symbols-outlined text-secondary text-2xl">call</span>
        Mobile Number • मोबाइल नंबर
      </label>
<div class="relative flex items-center">
<div class="absolute left-5 flex items-center gap-1.5 text-on-surface-variant font-bold text-xl pointer-events-none">
<span>+91</span>
</div>
<input class="w-full h-20 pl-20 pr-6 rounded-2xl bg-surface-container-low text-primary text-xl md:text-2xl font-medium tracking-wide border-2 border-transparent focus:border-secondary focus:bg-surface-container-lowest outline-none transition-all" id="patient-phone" placeholder="10-digit mobile number" type="tel" value="98765 43210"/>
</div>
</div>
<!-- State & City/District -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2" for="state-select">
<span class="material-symbols-outlined text-secondary text-2xl">map</span>
          State • राज्य
        </label>
<div class="relative">
<select class="w-full h-20 appearance-none px-6 pr-12 rounded-2xl bg-surface-container-low text-primary text-xl font-medium border-2 border-transparent focus:border-secondary focus:bg-surface-container-lowest outline-none cursor-pointer transition-all" id="state-select">
<option selected="">Delhi (दिल्ली)</option>
<option>Haryana (हरियाणा)</option>
<option>Uttar Pradesh (उत्तर प्रदेश)</option>
<option>Rajasthan (राजस्थान)</option>
<option>Other (अन्य राज्य)</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-3xl">expand_more</span>
</div>
</div>
<div class="flex flex-col gap-2.5">
<label class="font-headline text-lg md:text-xl font-bold text-primary flex items-center gap-2" for="district-select">
<span class="material-symbols-outlined text-secondary text-2xl">location_city</span>
          City / District • जिला
        </label>
<div class="relative">
<select class="w-full h-20 appearance-none px-6 pr-12 rounded-2xl bg-surface-container-low text-primary text-xl font-medium border-2 border-transparent focus:border-secondary focus:bg-surface-container-lowest outline-none cursor-pointer transition-all" id="district-select">
<option selected="">South Delhi (दक्षिण दिल्ली)</option>
<option>New Delhi (नई दिल्ली)</option>
<option>Central Delhi (मध्य दिल्ली)</option>
<option>North Delhi (उत्तर दिल्ली)</option>
<option>Other District (अन्य जिला)</option>
</select>
<span class="material-symbols-outlined absolute right-5 top-1/2 -translate-y-1/2 text-outline pointer-events-none text-3xl">expand_more</span>
</div>
</div>
</div>
</div>
<!-- 5. FOOTER / NAVIGATION: Large touchable Back and Continue buttons -->
<div class="mt-8 flex flex-col sm:flex-row items-center justify-between gap-4">
<button class="w-full sm:w-auto h-20 px-8 rounded-2xl bg-surface-container-low text-primary flex items-center justify-center gap-3 hover:bg-surface-container transition-all text-xl font-bold active:scale-98 border border-surface-container" type="button">
<span class="material-symbols-outlined text-3xl font-bold">arrow_back</span>
<span>Back • पीछे जाएँ</span>
</button>
<button class="w-full sm:w-auto flex-1 sm:max-w-md h-20 px-10 rounded-2xl bg-secondary text-on-secondary flex items-center justify-center gap-3 hover:bg-secondary/90 transition-all text-2xl font-bold shadow-lg shadow-secondary/20 active:scale-98" type="button">
<span>Continue • आगे बढ़ें</span>
<span class="material-symbols-outlined text-3xl font-bold">arrow_forward</span>
</button>
</div>
</main>
<script>
  (function() {
    // Age stepper logic
    const ageDisplay = document.getElementById('age-display');
    const btnDec = document.getElementById('age-decrement');
    const btnInc = document.getElementById('age-increment');
    let currentAge = 48;

    if (btnDec && ageDisplay) {
      btnDec.addEventListener('click', () => {
        if (currentAge > 1) {
          currentAge--;
          ageDisplay.textContent = currentAge;
        }
      });
    }

    if (btnInc && ageDisplay) {
      btnInc.addEventListener('click', () => {
        if (currentAge < 115) {
          currentAge++;
          ageDisplay.textContent = currentAge;
        }
      });
    }

    // Gender toggle buttons
    const genderBtns = document.querySelectorAll('.gender-btn');
    genderBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        genderBtns.forEach(b => {
          b.classList.remove('bg-primary', 'text-on-primary', 'shadow-md');
          b.classList.add('bg-surface-container-low', 'text-primary', 'border', 'border-surface-container');
        });
        btn.classList.remove('bg-surface-container-low', 'text-primary', 'border', 'border-surface-container');
        btn.classList.add('bg-primary', 'text-on-primary', 'shadow-md');
      });
    });
  })();
</script>
</body></html>
